<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Tu Asistente</title>
  <style>
    * {margin:0; padding:0; box-sizing:border-box; font-family:sans-serif;}
    body {background:#0f0f0f; color:#fff; min-height:100vh; padding:20px;}
    .contenedor {max-width:600px; margin:0 auto;}
    h1 {text-align:center; color:#00d9ff; margin-bottom:5px;}
    .subtitulo {text-align:center; color:#888; margin-bottom:30px;}
    .caja-chat {background:#1a1a1a; border-radius:12px; padding:20px; box-shadow:0 0 20px rgba(0,217,255,0.2);}
    .barra-estado {background:#222; padding:10px; border-radius:8px; margin-bottom:15px; color:#0f0;}
    .pantalla-msj {min-height:200px; background:#252525; border-radius:8px; padding:15px; margin-bottom:15px;}
    .mensaje {color:#00d9ff; line-height:1.6; margin-bottom:10px;}
    .entrada-area {display:flex; gap:10px;}
    input {flex:1; padding:12px; border:none; border-radius:8px; background:#333; color:#fff; font-size:16px;}
    button {padding:12px 25px; border:none; border-radius:8px; background:#00d9ff; color:#000; font-weight:bold; cursor:pointer;}
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>⚡ JARVIS</h1>
    <p class="subtitulo">Tu asistente — Creado por ti</p>
    <div class="caja-chat">
      <div class="barra-estado">✅ Sistema listo</div>
      <div class="pantalla-msj" id="pantalla">
        <div class="mensaje">¡Hola! Soy Jarvis. ¿En qué te ayudo?</div>
      </div>
      <div class="entrada-area">
        <input type="text" id="texto" placeholder="Escribe aquí...">
        <button onclick="enviar()">Enviar</button>
      </div>
    </div>
  </div>
  <script>
    function enviar() {
      const t = document.getElementById('texto');
      const p = document.getElementById('pantalla');
      if(t.value.trim()) {
        const m = document.createElement('div');
        m.className = 'mensaje';
        m.textContent = 'Tú: ' + t.value;
        p.appendChild(m);
        t.value = '';
        p.scrollTop = p.scrollHeight;
      }
    }
  </script>
</body>
</html>

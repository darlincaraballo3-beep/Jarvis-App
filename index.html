<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Tu Asistente Inteligente</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="contenedor">
    <header>
      <h1>⚡ JARVIS</h1>
      <p class="subtitulos">Tu asistente inteligente — Creado por ti</p>
    </header>

    <div class="caja-chat">
      <div id="estado-barra">
        <span id="estado">✅ Sistema listo</span>
      </div>
      
      <div id="pantalla-mensajes">
        <div class="mensaje sistema">
          ¡Hola! Soy Jarvis. ¿En qué puedo ayudarte hoy?
        </div>
      </div>

      <div class="entrada">
        <input type="text" id="texto-entrada" placeholder="Escribe tu mensaje...">
        <button id="btn-enviar">Enviar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

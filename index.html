<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS — Tu Asistente Inteligente</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { background: #0f0f0f; color: #fff; min-height: 100vh; padding: 20px; }
    .contenedor { max-width: 600px; margin: 0 auto; }
    h1 { text-align: center; color: #00d9ff; margin-bottom: 5px; }
    .subtitulos { text-align: center; color: #888; margin-bottom: 30px; }
    .caja-chat { background: #1a1a1a; border-radius: 12px; padding: 20px; box-shadow: 0 0 20px #00d9ff33; }
    #estado-barra { background: #222; padding: 10px; border-radius: 8px; margin-bottom: 15px; color: #0f0; }
    #pantalla-mensajes { min-height: 200px; background: #252525; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .mensaje-sistema { color: #00d9ff; line-height: 1.6; }
    .caja-entrada { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #333; color: #fff; font-size: 16px; }
    button { padding: 12px 25px; border: none; border-radius: 8px; background: #00d9ff; color: #000; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div class="contenedor">
    <h1>⚡ JARVIS</h1>
    <p class="subtitulos">Tu asistente inteligente — Creado por ti</p>

    <div class="caja-chat">
      <div id="estado-barra">
        ✅ Sistema listo
      </div>
      
      <div id="pantalla-mensajes">
        <div class="mensaje-sistema">
          ¡Hola! Soy Jarvis. ¿En qué puedo ayudarte hoy?
        </div>
      </div>

      <div class="caja-entrada">
        <input type="text" id="entrada-texto" placeholder="Escribe tu mensaje aquí...">
        <button id="boton-enviar">Enviar</button>
      </div>
    </div>
  </div>

  <script>
    const entrada = document.getElementById('entrada-texto');
    const boton = document.getElementById('boton-enviar');
    const pantalla = document.getElementById('pantalla-mensajes');

    boton.addEventListener('click', function() {
      if (entrada.value.trim() !== '') {
        const nuevoMensaje = document.createElement('div');
        nuevoMensaje.className = 'mensaje-sistema';
        nuevoMensaje.textContent = 'Tú: ' + entrada.value;
        pantalla.appendChild(nuevoMensaje);
        entrada.value = '';
        pantalla.scrollTop = pantalla.scrollHeight;
      }
    });
  </script>
</body>
</html>
